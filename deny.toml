# cargo-deny policy: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = false
features = ["image-selection", "object-detection", "document-layout", "burn", "burn-vulkan"]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `paste` is unmaintained (no vulnerability). It reaches us only through
    # burn 0.22 (optional `burn` feature); remove once Burn drops it.
    { id = "RUSTSEC-2024-0436", reason = "transitive via optional burn feature; unmaintained, not vulnerable" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
]

[bans]
# Duplicates come from rusto/rten/burn pinning different majors; not actionable here.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
